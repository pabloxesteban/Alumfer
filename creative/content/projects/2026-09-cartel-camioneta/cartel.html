<!doctype html><html lang="es-AR"><head><meta charset="utf-8">
<title>Cartel camioneta Alumfer</title>
<!--
  Carteles laterales de la camioneta (Peugeot 504 con caja metálica) — 2000 x 420 mm c/u.
  Mismo lenguaje que el cartel del frente (2026-09-cartel-frente).
  Se diseña a 2000 x 420 px CSS: 1 px = 1 mm a tamaño real. Todo es vector.
  Dos versiones espejadas: el logo siempre hacia la trompa del vehículo.
    #izquierdo (lado conductor): trompa a la izquierda de quien mira -> marca a la izquierda
    #derecho   (lado vereda):    trompa a la derecha               -> marca a la derecha
-->
<style>
@font-face{font-family:M;src:url('assets/Montserrat.ttf');font-weight:100 900;font-display:block}
@font-face{font-family:C;src:url('assets/BarlowCondensed-SemiBold.ttf');font-weight:600;font-display:block}
@font-face{font-family:C;src:url('assets/BarlowCondensed-Bold.ttf');font-weight:700;font-display:block}
:root{--dark:#121518; --graphite:#1e2227; --blue:#2f7fd6; --white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#777}
/* --bleed: sangrado por lado (0 en diseño; el export de imprenta lo pone en 30 mm = 30 px) */
.sign{--bleed:0px;width:2000px;height:420px;padding:var(--bleed);box-sizing:content-box;position:relative;isolation:isolate;
  display:flex;flex-direction:column;overflow:hidden;font-family:M;color:var(--white)}
.sign::before,.sign::after{content:"";position:absolute;left:0;right:0;z-index:-1}
.sign::before{top:0;height:calc(var(--bleed) + 306px);background:var(--dark)} /* 6 px de más: queda debajo del grafito */
.sign::after{bottom:0;height:calc(var(--bleed) + 120px);background:var(--graphite)}
.top{flex:1;display:flex}

/* ============ MARCA ============ */
.left{flex:0 0 1140px;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center}
.left .shade{position:absolute;z-index:-1;left:calc(var(--bleed) * -1);top:calc(var(--bleed) * -1);width:calc(100% + var(--bleed));height:calc(100% + var(--bleed))}
.lock{display:flex;align-items:center;gap:36px}
.lock svg{width:232px;height:auto;flex:0 0 auto}
.wm{display:flex;flex-direction:column;align-items:center}
.name{font-weight:700;font-size:146px;letter-spacing:6px;line-height:.8;margin-right:-6px}
.sub{font-weight:600;font-size:33px;letter-spacing:11.8px;margin-right:-11.8px;text-transform:uppercase;margin-top:20px;white-space:nowrap}

/* ============ PANEL METALIZADO ============ */
.right{flex:1;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center}
.right .metal{position:absolute;z-index:-1;left:0;top:calc(var(--bleed) * -1);right:calc(var(--bleed) * -1);bottom:0;width:calc(100% + var(--bleed));height:calc(100% + var(--bleed))}
.right::before,.right::after{content:"";position:absolute;top:calc(var(--bleed) * -1);bottom:0}
.right::before{left:0;width:2px;background:rgba(0,0,0,.55)}
.right::after{left:2px;width:1px;background:rgba(255,255,255,.22)}
.claim{font-family:C;font-weight:600;font-size:92px;letter-spacing:4px;text-transform:uppercase;line-height:.9;white-space:nowrap;margin-right:-4px}
.rule{width:120px;height:4px;background:#8cc3f8;margin:16px 0 14px}
.seco{font-family:C;font-weight:700;font-size:62px;letter-spacing:2px;text-transform:uppercase;line-height:1;white-space:nowrap;
  color:var(--blue);-webkit-text-stroke:2.6px #fff;paint-order:stroke fill} /* mismo azul que el isologo, contorno blanco */
.seco2{font-family:C;font-weight:600;font-size:50px;letter-spacing:2px;text-transform:uppercase;line-height:1;white-space:nowrap;margin-top:8px}

/* ============ FRANJA DE CONTACTO ============ */
.band{flex:0 0 120px;position:relative;display:flex;align-items:center;justify-content:space-evenly;padding:0 30px;white-space:nowrap}
.band::before{content:"";position:absolute;top:0;height:2px;left:calc(var(--bleed) * -1);right:calc(var(--bleed) * -1);background:rgba(255,255,255,.14)}
.band span{display:flex;align-items:center;gap:18px}
.band i{width:2px;height:60px;background:rgba(255,255,255,.2)}
.band .wa{font-family:C;font-weight:700;font-size:74px;letter-spacing:1px}
.band .wa svg{width:62px;height:62px;transform:translateY(5px)}
.band em{font-style:normal;font-weight:400;color:rgba(255,255,255,.2);margin:0 12px}
.band .soc{font-family:C;font-weight:600;font-size:52px;letter-spacing:1px}
.band .soc svg{width:58px;height:58px;transform:translateY(4px)}

/* ============ VERSIÓN ESPEJADA (lado derecho / vereda) ============ */
.espejo .top,.espejo .band{flex-direction:row-reverse} /* el logo queda siempre a la izquierda de ALUMFER */
.espejo .right::before{left:auto;right:0}
.espejo .right::after{left:auto;right:2px}
.espejo .right .metal{left:calc(var(--bleed) * -1);right:0;transform:scaleX(-1)}
.espejo .left .shade{left:0}
</style></head>
