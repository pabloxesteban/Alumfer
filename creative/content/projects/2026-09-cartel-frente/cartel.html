<!doctype html><html lang="es-AR"><head><meta charset="utf-8">
<title>Cartel frente Alumfer</title>
<!--
  Cartel del frente del local — 5400 x 1200 (proporción 4,5 : 1).
  Se diseña a 1800 x 400 px CSS y se exporta a 3x = 5400 x 1200 px (ver README).
  Todo es vector (texto, isologo): se puede exportar a la resolución que pida la imprenta.
-->
<style>
@font-face{font-family:M;src:url('assets/Montserrat.ttf');font-weight:100 900;font-display:block}
@font-face{font-family:I;src:url('assets/Inter.ttf');font-weight:100 900;font-display:block}
:root{
  --carbon:#1A1C1E; --steel:#2E3338; --blue:#1B6CC8; --blue-l:#4A9DE8; --concrete:#B0A99A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#777}
.sign{width:1800px;height:400px;position:relative;overflow:hidden;color:#fff;font-family:I;
  display:flex;flex-direction:column;
  /* aluminio anodizado oscuro: base carbon con un cepillado muy sutil */
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#26292d 0%,#1A1C1E 70%);}
/* línea de identidad azul arriba */
.sign::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--blue)}

.main{flex:1;display:flex;align-items:center;justify-content:space-between;padding:8px 36px 0}

/* ===== 1. MARCA ===== */
.brand{display:flex;align-items:center;gap:26px}
.brand svg{width:184px;height:auto;color:#fff;flex:0 0 auto}
.wm .name{font-family:M;font-weight:600;font-size:90px;letter-spacing:6.5px;line-height:.84;margin-right:-6.5px}
.wm .sub{font-family:M;font-weight:700;font-size:20.4px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--concrete);margin-top:18px;white-space:nowrap}

/* separadores: dos trazos paralelos a 60°, como los del isologo */
.sep{position:relative;align-self:stretch;margin:60px 46px 60px 20px;width:24px;flex:0 0 auto}
.sep i{position:absolute;top:0;bottom:0;width:7px;background:var(--blue);transform:skewX(-30deg)}
.sep i+i{left:15px;background:rgba(255,255,255,.2)}

/* ===== 2. PROPUESTA ===== */
.hook{font-family:M;font-weight:800;font-style:italic;font-size:51px;letter-spacing:.3px;line-height:.98;white-space:nowrap}
.feat{font-family:M;font-weight:600;font-size:25px;line-height:1.3;color:#e6e6e6;margin-top:16px;white-space:nowrap}
.feat b{color:var(--blue-l);font-weight:800;margin-right:10px}

/* ===== 3. CONTACTO ===== */
.contact .k{font-family:M;font-weight:700;font-size:19px;letter-spacing:3px;text-transform:uppercase;color:var(--concrete)}
.contact .phone{display:flex;align-items:center;gap:14px;margin-top:10px}
.contact .phone svg{width:54px;height:54px;flex:0 0 auto}
.contact .phone .n{font-family:M;font-weight:800;font-size:55px;letter-spacing:.3px;line-height:1;white-space:nowrap}
.contact .rows{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.contact .rows .r{display:flex;align-items:center;gap:14px;font-family:M;font-weight:600;font-size:26px;white-space:nowrap}
.contact .rows svg{width:30px;height:30px;flex:0 0 auto}
.iw{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ib{stroke:var(--blue-l)}

/* ===== 4. FRANJA DE LÍNEAS ===== */
.band{flex:0 0 76px;background:var(--blue);display:flex;align-items:center;justify-content:center;gap:26px;
  font-family:M;font-weight:700;font-size:29px;letter-spacing:3px;text-transform:uppercase;white-space:nowrap}
.band .lb{font-weight:600;font-size:20px;letter-spacing:4px;color:rgba(255,255,255,.72);margin-right:8px}
.band b{width:9px;height:9px;background:#fff;opacity:.55;transform:rotate(45deg);flex:0 0 auto}
</style></head>
<body><div class="sign">

  <div class="main">
    <div class="brand">
      <svg viewBox="0 0 368 259" aria-label="Alumfer"><g fill="currentColor">
        <polygon points="115,1 148,1 239.8,160 206.8,160"/>
        <polygon points="181.7,20 214.2,20 295.1,160 262.6,160"/>
        <polygon points="1,258 35,258 139.7,76.6 122.7,47.2"/>
        <polygon points="59,258 93.5,258 169.2,126.8 152,97"/>
        <polygon points="145,209.5 350,209.5 367.3,179.5 162.3,179.5"/>
        <polygon points="116.2,257.8 280.4,257.8 297.5,228.2 133.3,228.2"/>
      </g></svg>
      <div class="wm"><div class="name">ALUMFER</div><div class="sub">Carpintería de aluminio</div></div>
    </div>

    <div class="sep"><i></i><i></i></div>

    <div class="offer">
      <div class="hook">SOMOS<br>FABRICANTES</div>
      <div class="feat"><b>—</b>Trabajos a medida<br><b>—</b>Colocación en obra</div>
    </div>

    <div class="sep"><i></i><i></i></div>

    <div class="contact">
      <div class="k">Presupuesto sin cargo</div>
      <div class="phone">
        <svg viewBox="0 0 24 24"><path class="iw ib" d="M4.5 19.5l1.2-3.9A7.6 7.6 0 1112 20a7.7 7.7 0 01-3.6-.9l-3.9 1.4z"/><path class="iw ib" d="M9 8.5c.3 3 2.5 5.2 5.5 5.5.6.06 1-.3 1.2-.8.1-.4-.1-.7-.5-.9l-1.3-.5c-.3-.1-.6 0-.8.2-.5.6-1.4.3-2.1-.9-.7-1.2-.5-2 .2-2.3.3-.1.4-.4.3-.7l-.4-1.4c-.1-.4-.4-.7-.9-.6-.5.1-.9.5-.9 1.1z"/></svg>
        <span class="n">11 6336-8643</span>
      </div>
      <div class="rows">
        <div class="r"><svg viewBox="0 0 24 24"><rect class="iw" x="3.5" y="3.5" width="17" height="17" rx="5"/><circle class="iw" cx="12" cy="12" r="4"/><circle cx="16.7" cy="7.3" r="1.3" fill="#fff"/></svg>@alumfercarpinteria</div>
        <div class="r"><svg viewBox="0 0 24 24"><circle class="iw" cx="12" cy="12" r="9"/><path class="iw" d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>www.alumfer.com.ar</div>
      </div>
    </div>
  </div>

  <div class="band">
    <span class="lb">Nuestras líneas</span>
    Modena 1<b></b>Modena 2<b></b>A-30 New<b></b>Herrero<b></b>Ekonal<b></b>Rotonda
  </div>
</div></body></html>
