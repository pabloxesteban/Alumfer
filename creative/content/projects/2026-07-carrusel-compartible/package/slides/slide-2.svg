xt x="785" y="548" text-anchor="middle" fill="#9C6B3B" font-size="27" font-weight="800" letter-spacing="3">MADERA</text><text x="785" y="580" text-anchor="middle" fill="#B0A99A" font-size="20" font-weight="600" letter-spacing="2">…Y EN CUOTAS</text><text x="90" y="720" fill="#FFFFFF" font-size="94" font-weight="800" letter-spacing="-3">Existen dos.</text><text x="90" y="820" fill="#E8E4DC" font-size="40">La que pagás una vez. Y la que pagás en</text><text x="90" y="874" font-size="40" font-weight="700"><tspan fill="#4A9DE8">cuotas</tspan><tspan fill="#E8E4DC" font-weight="400"> —sin que nadie te avise— durante años.</tspan></text></svg>