<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1080" height="1080" fill="#1A1C1E"/>
  <!-- two overlapping frame outlines = "the second window" -->
  <rect x="640" y="150" width="330" height="330" fill="none" stroke="#B0A99A" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="700" y="210" width="330" height="330" fill="none" stroke="#B0A99A" stroke-opacity="0.20" stroke-width="2"/>
  <!-- kicker -->
  <text x="96" y="150" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="3">CUOTA FINAL<tspan fill="#B0A99A" font-weight="700"> · LA SEGUNDA VENTANA</tspan></text>
  <line x1="96" y1="176" x2="470" y2="176" stroke="#B0A99A" stroke-opacity="0.3" stroke-width="2"/>
  <!-- headline -->
  <text x="96" y="440" fill="#FFFFFF" font-size="80" font-weight="800" letter-spacing="-2">A los pocos años</text>
  <text x="96" y="532" fill="#FFFFFF" font-size="80" font-weight="800" letter-spacing="-2">la cambiás igual.</text>
  <!-- kicker line 2 -->
  <text x="96" y="712" fill="#B0A99A" font-size="46" font-weight="400">Y pagás la instalación</text>
  <text x="96" y="872" fill="#4A9DE8" font-size="150" font-weight="800" letter-spacing="-5">dos veces.</text>
</svg>
