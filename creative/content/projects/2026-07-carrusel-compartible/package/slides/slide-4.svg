<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1080" height="1080" fill="#1A1C1E"/>
  <!-- kicker -->
  <text x="96" y="150" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="3">CUOTA 2<tspan fill="#B0A99A" font-weight="700"> · EL RUIDO</tspan></text>
  <line x1="96" y1="176" x2="330" y2="176" stroke="#B0A99A" stroke-opacity="0.3" stroke-width="2"/>
  <!-- window -->
  <rect x="560" y="250" width="300" height="300" fill="#202225" stroke="#B0A99A" stroke-width="3"/>
  <line x1="710" y1="250" x2="710" y2="550" stroke="#B0A99A" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="560" y1="400" x2="860" y2="400" stroke="#B0A99A" stroke-opacity="0.6" stroke-width="2"/>
  <!-- sound waves passing THROUGH -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M470 400 a90 90 0 0 0 -150 0" stroke-opacity="0.85" stroke-width="4"/>
    <path d="M430 400 a130 130 0 0 0 -230 0" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M390 400 a170 170 0 0 0 -300 0" stroke-opacity="0.3" stroke-width="2"/>
  </g>
  <circle cx="470" cy="400" r="7" fill="#FFFFFF"/>
  <!-- headline -->
  <text x="96" y="710" fill="#FFFFFF" font-size="70" font-weight="800" letter-spacing="-2">La avenida, el colectivo,</text>
  <text x="96" y="786" fill="#FFFFFF" font-size="70" font-weight="800" letter-spacing="-2">el vecino.</text>
  <!-- body -->
  <text x="96" y="872" fill="#B0A99A" font-size="38" font-weight="400">Una ventana barata no los frena:</text>
  <text x="96" y="924" font-size="38" font-weight="700"><tspan fill="#B0A99A" font-weight="400">los deja pasar a tu </tspan><tspan fill="#4A9DE8">living.</tspan></text>
</svg>
