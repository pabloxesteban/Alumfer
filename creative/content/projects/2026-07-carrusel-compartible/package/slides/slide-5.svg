/text><text x="90" y="832" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.5">El marco que se hincha.</text><text x="90" y="920" font-size="38" font-weight="700"><tspan fill="#B0A99A" font-weight="400">El problema no era la casa. Era la </tspan><tspan fill="#4A9DE8">abertura.</tspan></text></svg>