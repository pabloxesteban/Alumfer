<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1080" height="1080" fill="#1A1C1E"/>
  <!-- kicker -->
  <text x="96" y="150" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="3">CUOTA 3<tspan fill="#B0A99A" font-weight="700"> · LA HUMEDAD</tspan></text>
  <line x1="96" y1="176" x2="360" y2="176" stroke="#B0A99A" stroke-opacity="0.3" stroke-width="2"/>
  <!-- window with condensation + mould corner -->
  <rect x="420" y="240" width="300" height="300" fill="#202225" stroke="#B0A99A" stroke-width="3"/>
  <line x1="570" y1="240" x2="570" y2="540" stroke="#B0A99A" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="420" y1="390" x2="720" y2="390" stroke="#B0A99A" stroke-opacity="0.6" stroke-width="2"/>
  <!-- condensation droplets -->
  <g fill="#B0A99A" fill-opacity="0.45">
    <ellipse cx="470" cy="300" rx="6" ry="9"/><ellipse cx="520" cy="340" rx="5" ry="8"/>
    <ellipse cx="495" cy="450" rx="7" ry="11"/><ellipse cx="640" cy="310" rx="5" ry="8"/>
    <ellipse cx="660" cy="470" rx="6" ry="10"/><ellipse cx="450" cy="500" rx="5" ry="8"/>
    <ellipse cx="610" cy="430" rx="4" ry="7"/><ellipse cx="540" cy="500" rx="6" ry="9"/>
  </g>
  <!-- mould cluster (bottom-left corner) -->
  <g fill="#4a4a3d" fill-opacity="0.9">
    <circle cx="435" cy="525" r="10"/><circle cx="452" cy="530" r="7"/><circle cx="428" cy="512" r="6"/>
    <circle cx="446" cy="516" r="5"/><circle cx="460" cy="524" r="4"/>
  </g>
  <!-- headline -->
  <text x="96" y="700" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.5">Condensación en el vidrio.</text>
  <text x="96" y="766" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.5">Moho en la pared.</text>
  <text x="96" y="832" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.5">El marco que se hincha.</text>
  <!-- body -->
  <text x="96" y="920" font-size="38" font-weight="700"><tspan fill="#B0A99A" font-weight="400">El problema no era la casa. Era la </tspan><tspan fill="#4A9DE8">abertura.</tspan></text>
</svg>
