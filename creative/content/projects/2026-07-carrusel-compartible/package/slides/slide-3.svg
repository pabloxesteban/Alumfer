<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <rect width="1080" height="1080" fill="#1A1C1E"/>
  <!-- kicker -->
  <text x="96" y="150" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="3">CUOTA 1<tspan fill="#B0A99A" font-weight="700"> · EL INVIERNO</tspan></text>
  <line x1="96" y1="176" x2="360" y2="176" stroke="#B0A99A" stroke-opacity="0.3" stroke-width="2"/>
  <!-- window + cold air escaping through the frame gap -->
  <rect x="420" y="250" width="300" height="300" fill="#202225" stroke="#B0A99A" stroke-width="3"/>
  <line x1="570" y1="250" x2="570" y2="550" stroke="#B0A99A" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="420" y1="400" x2="720" y2="400" stroke="#B0A99A" stroke-opacity="0.6" stroke-width="2"/>
  <!-- gap on left edge -->
  <line x1="420" y1="330" x2="420" y2="470" stroke="#1A1C1E" stroke-width="8"/>
  <!-- cold arrows entering -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 330 H432"/><path d="M420 330 l-14 -9 M420 330 l-14 9"/>
    <path d="M290 400 H432"/><path d="M420 400 l-14 -9 M420 400 l-14 9"/>
    <path d="M300 470 H432"/><path d="M420 470 l-14 -9 M420 470 l-14 9"/>
  </g>
  <text x="300" y="300" fill="#B0A99A" font-size="20" font-weight="700" letter-spacing="3">FRÍO</text>
  <!-- flame (gas) -->
  <path d="M770 470 c-26 -18 -14 -46 4 -60 c-2 22 20 20 14 44 c20 -6 16 -30 6 -44 c30 16 34 54 8 74 c-14 10 -30 6 -32 -14 z" fill="none" stroke="#B0A99A" stroke-width="3"/>
  <!-- headline -->
  <text x="96" y="740" fill="#FFFFFF" font-size="64" font-weight="800" letter-spacing="-1.5">El frío que entra por</text>
  <text x="96" y="812" fill="#FFFFFF" font-size="64" font-weight="800" letter-spacing="-1.5">el marco lo pagás en</text>
  <text x="96" y="884" font-size="64" font-weight="800" letter-spacing="-1.5"><tspan fill="#FFFFFF">la factura de </tspan><tspan fill="#4A9DE8">gas.</tspan></text>
  <!-- body -->
  <text x="96" y="960" fill="#B0A99A" font-size="36" font-weight="400">Todos los meses fríos. Todos los años.</text>
</svg>
