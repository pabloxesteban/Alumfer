674,204 674,504" fill="#8A9096" fill-opacity="0.6" stroke="#C9CDD1" stroke-width="3"/><g stroke="#4A9DE8" stroke-width="4" fill="none" stroke-linecap="round"><line x1="300" y1="320" x2="424" y2="320"/><polyline points="412,327 424,320 412,313"/></g><g stroke="#4A9DE8" stroke-width="4" fill="none" stroke-linecap="round"><line x1="300" y1="390" x2="424" y2="390"/><polyline points="412,397 424,390 412,383"/></g><line x1="426" y1="300" x2="426" y2="410" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7"/><g stroke="#E8E4DC" stroke-width="4" fill="none" stroke-linecap="round"><line x1="300" y1="516" x2="720" y2="516"/><polyline points="708,523 720,516 708,509"/></g><text x="512" y="500" text-anchor="middle" fill="#E8E4DC" font-size="17" font-weight="700" letter-spacing="1">…pero por el marco viejo, sí</text><text x="90" y="742" fill="#FFFFFF" font-size="60" font-weight="800" letter-spacing="-1.5">El frío no pasa por el DVH.</text><text x="90" y="812" font-size="60" font-weight="800" letter-spacing="-1.5"><tspan fill="#FFFFFF">Pasa por el </tspan><tspan fill="#4A9DE8">marco viejo</tspan><tspan fill="#FFFFFF">.</tspan></text><text x="90" y="884" fill="#B0A99A" font-size="36">Y ese frío lo pagás en la factura de gas.</text><text x="90" y="936" fill="#B0A99A" font-size="36">Todos los meses fríos. Todos los años.</text></svg>