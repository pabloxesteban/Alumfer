<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <defs>
    <linearGradient id="btm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#1A1C1E" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1A1C1E" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1A1C1E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="260" fill="url(#top)"/>
  <rect width="1080" height="1080" fill="url(#btm)"/>
  <text x="90" y="150" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="3">CUOTA 3<tspan fill="#B0A99A" font-weight="700"> · LA HUMEDAD</tspan></text>
  <line x1="90" y1="176" x2="354" y2="176" stroke="#B0A99A" stroke-opacity="0.5" stroke-width="2"/>
  <text x="90" y="700" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.5">Condensación en el vidrio.</text>
  <text x="90" y="766" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.5">Moho en la pared.</text>
  <text x="90" y="832" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1.5">El marco que se hincha.</text>
  <text x="90" y="920" font-size="38" font-weight="700"><tspan fill="#B0A99A" font-weight="400">El problema no era la casa. Era la </tspan><tspan fill="#4A9DE8">abertura.</tspan></text>
