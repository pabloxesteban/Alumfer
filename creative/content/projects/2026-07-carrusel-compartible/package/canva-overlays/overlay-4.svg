  <text x="90" y="150" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="3">CUOTA 2<tspan fill="#B0A99A" font-weight="700"> · EL RUIDO</tspan></text>
  <line x1="90" y1="176" x2="324" y2="176" stroke="#B0A99A" stroke-opacity="0.5" stroke-width="2"/>
  <text x="90" y="710" fill="#FFFFFF" font-size="70" font-weight="800" letter-spacing="-2">La avenida, el colectivo,</text>
  <text x="90" y="786" fill="#FFFFFF" font-size="70" font-weight="800" letter-spacing="-2">el vecino.</text>
  <text x="90" y="872" fill="#B0A99A" font-size="38" font-weight="400">Una ventana barata no los frena:</text>
  <text x="90" y="924" font-size="38" font-weight="700"><tspan fill="#B0A99A" font-weight="400">los deja pasar a tu </tspan><tspan fill="#4A9DE8">living.</tspan></text>
