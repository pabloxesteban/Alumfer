  <text x="90" y="150" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="3">CUOTA FINAL<tspan fill="#B0A99A" font-weight="700"> · LA SEGUNDA VENTANA</tspan></text>
  <line x1="90" y1="176" x2="464" y2="176" stroke="#B0A99A" stroke-opacity="0.5" stroke-width="2"/>
  <text x="90" y="560" fill="#FFFFFF" font-size="80" font-weight="800" letter-spacing="-2">A los pocos años</text>
  <text x="90" y="652" fill="#FFFFFF" font-size="80" font-weight="800" letter-spacing="-2">la cambiás igual.</text>
  <text x="90" y="792" fill="#B0A99A" font-size="46" font-weight="400">Y pagás la instalación</text>
  <text x="90" y="944" fill="#4A9DE8" font-size="150" font-weight="800" letter-spacing="-5">dos veces.</text>
