<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <defs>
    <linearGradient id="btm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E" stop-opacity="0"/>
      <stop offset="0.40" stop-color="#1A1C1E" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1A1C1E" stop-opacity="0.94"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#btm)"/>
  <text x="90" y="742" fill="#FFFFFF" font-size="58" font-weight="800" letter-spacing="-1.5">No es cara la ventana buena.</text>
  <text x="90" y="810" font-size="58" font-weight="800" letter-spacing="-1.5"><tspan fill="#FFFFFF">Es </tspan><tspan fill="#4A9DE8">carísima</tspan><tspan fill="#FFFFFF"> la barata,</tspan></text>
  <text x="90" y="878" fill="#FFFFFF" font-size="58" font-weight="800" letter-spacing="-1.5">pagada de a poco.</text>
  <text x="90" y="936" fill="#B0A99A" font-size="30" font-weight="400">Fabricamos las nuestras, sin intermediarios. Por eso te decimos esto —</text>
  <text x="90" y="976" fill="#B0A99A" font-size="30" font-weight="400">incluso cuando a veces te decimos que no cambies todo.</text>
</svg>
