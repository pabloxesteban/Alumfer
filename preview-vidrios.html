<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Preview Vidrios</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; font-family:Inter,sans-serif; color:#fff; padding:2rem; }
  h2 { font-size:.7rem; font-weight:400; color:#B0A99A; letter-spacing:.12em; text-transform:uppercase; margin:2rem 0 1rem; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
  .card { border-radius:3px; overflow:hidden; border:1px solid #333; }
  .card img { width:100%; height:180px; object-fit:cover; display:block; filter:brightness(.75); }
  .card p { font-size:.7rem; color:#B0A99A; padding:.5rem; text-align:center; }
</style>
</head>
<body>

<h2>Transparente</h2>
<div class="grid">
  <div class="card"><img src="https://images.unsplash.com/photo-1523477593243-78bbf626fd3b?w=500&q=75&auto=format&fit=crop"><p>1</p></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1469981283837-561b3779462f?w=500&q=75&auto=format&fit=crop"><p>2</p></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1652862730507-32988eb23a67?w=500&q=75&auto=format&fit=crop"><p>3</p></div>
</div>

<h2>Esmerilado</h2>
<div class="grid">
  <div class="card"><img src="https://images.unsplash.com/photo-1584384689201-e0bcbe2c7f1d?w=500&q=75&auto=format&fit=crop"><p>A</p></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1517340182-ddc4e441b011?w=500&q=75&auto=format&fit=crop"><p>B</p></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1612220343549-3d33b739e50d?w=500&q=75&auto=format&fit=crop"><p>C</p></div>
</div>

<h2>Espejado</h2>
<div class="grid">
  <div class="card"><img src="https://images.unsplash.com/photo-1509611155844-4f9bc0098d85?w=500&q=75&auto=format&fit=crop"><p>X</p></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1583405751003-9e2fd7677c0d?w=500&q=75&auto=format&fit=crop"><p>Y</p></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1630775054487-f7400dde1469?w=500&q=75&auto=format&fit=crop"><p>Z</p></div>
</div>

</body>
</html>
