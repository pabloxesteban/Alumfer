<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias — Alumfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <style>
    html, body { height: 100%; background: var(--carbon); }
    body { display: flex; flex-direction: column; }

    .gracias-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-6);
    }

    .gracias {
      text-align: center;
      max-width: 480px;
    }

    .gracias__icon {
      width: 72px; height: 72px;
      border: 2px solid var(--blue-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-8);
    }

    .gracias__eyebrow {
      font-size: var(--text-xs);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--blue-light);
      margin-bottom: var(--space-3);
    }

    .gracias__title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--text-on-dark);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: var(--space-4);
    }

    .gracias__text {
      color: var(--text-on-dark-2);
      font-size: var(--text-sm);
      line-height: 1.8;
      margin-bottom: var(--space-10);
    }

    .gracias__divider {
      width: 40px;
      height: 2px;
      background: var(--blue-light);
      margin: 0 auto var(--space-8);
    }

    .gracias-footer {
      padding: var(--space-6);
      text-align: center;
      border-top: 1px solid var(--border);
    }
    .gracias-footer p {
      font-size: var(--text-xs);
      color: var(--text-on-dark-3);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar--scrolled" role="navigation" aria-label="Navegación principal">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo" aria-label="Alumfer — inicio" style="text-decoration:none">
        <img src="solologo.png" alt="" class="navbar__logo-img" aria-hidden="true">
        <div class="navbar__logo-text">
          <span class="navbar__logo-name">ALUMFER</span>
          <span class="navbar__logo-sub">Carpintería de aluminio</span>
        </div>
      </a>
    </div>
  </nav>

  <div class="gracias-wrap">
    <div class="gracias">
      <div class="gracias__icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--blue-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <p class="gracias__eyebrow">Mensaje recibido</p>
      <h1 class="gracias__title">¡Gracias por contactarnos!</h1>
      <div class="gracias__divider"></div>
      <p class="gracias__text">Recibimos tu consulta y nos comunicaremos con vos en menos de 24 horas.</p>
      <a href="index.html" class="btn btn--primary">Volver al inicio</a>
    </div>
  </div>

  <footer class="gracias-footer">
    <p>© 2026 Alumfer · Adrogué, Buenos Aires</p>
  </footer>

</body>
</html>
